name: Generate Contribution Snake

on:
  schedule:
    # 매일 00:00 UTC 실행
    - cron: "0 0 * * *"
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:
  # main 브랜치 push 시에도 실행
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF8FB3&color_dots=%23FDECEF,%23D4F5DD,%23A9EBC0,%237EDDA3,%2352C77F
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF8FB3&color_dots=%232A2233,%23C7F0D6,%2394E3B4,%2360D592,%232FC172

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
